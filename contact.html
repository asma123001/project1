<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Cutiesss</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 92px 20px 32px;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: #3d2432;
      background:
        radial-gradient(circle at 14% 18%, rgba(255, 255, 255, 0.9), transparent 18rem),
        radial-gradient(circle at 84% 18%, rgba(255, 241, 161, 0.8), transparent 16rem),
        radial-gradient(circle at 50% 92%, rgba(181, 238, 255, 0.9), transparent 19rem),
        linear-gradient(135deg, #ffc7dd 0%, #fff1ad 45%, #b9efff 100%);
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 22px;
      pointer-events: none;
      border: 2px dashed rgba(255, 255, 255, 0.82);
      border-radius: 34px;
    }

    body::after {
      inset: 36px;
      border-style: solid;
      border-color: rgba(255, 121, 171, 0.18);
    }

    .nav {
      position: fixed;
      top: 24px;
      left: 50%;
      z-index: 5;
      display: flex;
      gap: 10px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.72);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      box-shadow: 0 12px 34px rgba(219, 95, 144, 0.18);
      backdrop-filter: blur(12px);
      transform: translateX(-50%);
    }

    .nav a {
      min-width: 82px;
      padding: 10px 14px;
      color: #8d4667;
      font-size: 15px;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      border-radius: 999px;
      transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .nav a:hover,
    .nav a.active {
      color: #ffffff;
      background: #ff6fa9;
      transform: translateY(-2px);
    }

    .card {
      position: relative;
      width: min(90vw, 660px);
      padding: clamp(36px, 8vw, 62px) clamp(24px, 7vw, 52px);
      text-align: center;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 249, 253, 0.78)),
        repeating-linear-gradient(90deg, transparent 0 22px, rgba(255, 154, 195, 0.08) 22px 26px);
      border: 4px solid rgba(255, 255, 255, 0.95);
      border-radius: 34px;
      box-shadow:
        0 28px 80px rgba(219, 95, 144, 0.25),
        inset 0 0 0 2px rgba(255, 139, 187, 0.16);
      backdrop-filter: blur(14px);
      animation: floaty 4s ease-in-out infinite;
    }

    .tag {
      display: inline-flex;
      min-height: 34px;
      padding: 8px 16px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      color: #a2476e;
      background: #fff3a8;
      border: 2px solid #ffffff;
      border-radius: 999px;
      box-shadow: 0 8px 18px rgba(255, 193, 92, 0.22);
    }

    h1 {
      font-size: clamp(44px, 11vw, 82px);
      line-height: 1;
      letter-spacing: 0;
      color: #ff4f96;
      text-shadow: 4px 4px 0 #ffffff, 0 10px 22px rgba(255, 97, 160, 0.22);
    }

    p {
      max-width: 500px;
      margin: 20px auto 0;
      font-size: clamp(18px, 5vw, 24px);
      line-height: 1.45;
      color: #705163;
    }

    .contact-box {
      display: grid;
      gap: 12px;
      max-width: 460px;
      margin: 28px auto 0;
    }

    .contact-box a {
      display: block;
      padding: 15px 16px;
      color: #7a4260;
      font-weight: 900;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.68);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      box-shadow: 0 10px 22px rgba(255, 126, 179, 0.12);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .contact-box a:hover {
      background: #ffffff;
      transform: translateY(-3px);
    }

    .sparkle {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 22px #ffffff;
      animation: twinkle 2.8s ease-in-out infinite;
    }

    .sparkle:nth-child(1) { top: 16%; left: 18%; }
    .sparkle:nth-child(2) { top: 24%; right: 15%; animation-delay: 0.5s; }
    .sparkle:nth-child(3) { bottom: 18%; left: 14%; animation-delay: 1s; }
    .sparkle:nth-child(4) { bottom: 24%; right: 18%; animation-delay: 1.5s; }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.35; transform: scale(0.65); }
      50% { opacity: 1; transform: scale(1.35); }
    }

    @media (max-width: 520px) {
      body::before,
      body::after {
        inset: 12px;
        border-radius: 24px;
      }

      .nav {
        top: 14px;
        width: calc(100vw - 28px);
      }

      .nav a {
        min-width: 0;
        flex: 1;
        padding-inline: 8px;
      }
    }
  </style>
</head>
<body>
  <span class="sparkle"></span>
  <span class="sparkle"></span>
  <span class="sparkle"></span>
  <span class="sparkle"></span>

  <nav class="nav" aria-label="Main pages">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a class="active" href="contact.html">Contact</a>
  </nav>

  <main class="card" aria-label="Contact page">
    <div class="tag">send a tiny hello</div>
    <h1>contact cutiesss</h1>
    <p>Drop a sweet note, a happy thought, or just a tiny sparkle of good energy.</p>
    <div class="contact-box" aria-label="Contact links">
      <a href="mailto:hello@example.com">hello@example.com</a>
      <a href="tel:+1234567890">+1 234 567 890</a>
      <a href="index.html">back to the cute home page</a>
    </div>
  </main>
</body>
</html>
