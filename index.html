<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Cutiesss</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: #3d2432;
      background:
        radial-gradient(circle at 14% 18%, rgba(255, 255, 255, 0.9), transparent 18rem),
        radial-gradient(circle at 84% 18%, rgba(255, 241, 161, 0.8), transparent 16rem),
        radial-gradient(circle at 50% 92%, rgba(181, 238, 255, 0.9), transparent 19rem),
        linear-gradient(135deg, #ffc7dd 0%, #fff1ad 45%, #b9efff 100%);
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 22px;
      pointer-events: none;
      border: 2px dashed rgba(255, 255, 255, 0.82);
      border-radius: 34px;
    }

    body::after {
      inset: 36px;
      border-style: solid;
      border-color: rgba(255, 121, 171, 0.18);
    }

    .card {
      position: relative;
      width: min(90vw, 610px);
      padding: clamp(36px, 8vw, 62px) clamp(24px, 7vw, 52px);
      text-align: center;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 249, 253, 0.78)),
        repeating-linear-gradient(90deg, transparent 0 22px, rgba(255, 154, 195, 0.08) 22px 26px);
      border: 4px solid rgba(255, 255, 255, 0.95);
      border-radius: 34px;
      box-shadow:
        0 28px 80px rgba(219, 95, 144, 0.25),
        inset 0 0 0 2px rgba(255, 139, 187, 0.16);
      backdrop-filter: blur(14px);
      animation: floaty 4s ease-in-out infinite;
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      top: -28px;
      width: 78px;
      height: 58px;
      background: #ff7eb3;
      border-radius: 60% 40% 55% 45%;
      box-shadow: 0 10px 24px rgba(255, 88, 152, 0.22);
      transform: rotate(-18deg);
    }

    .card::before {
      left: 48px;
    }

    .card::after {
      right: 48px;
      transform: rotate(18deg);
      background: #73d9f4;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 8px 16px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      color: #a2476e;
      background: #fff3a8;
      border: 2px solid #ffffff;
      border-radius: 999px;
      box-shadow: 0 8px 18px rgba(255, 193, 92, 0.22);
    }

    .face {
      font-size: clamp(72px, 18vw, 128px);
      line-height: 1;
      margin-bottom: 16px;
      filter: drop-shadow(0 10px 12px rgba(255, 150, 190, 0.32));
    }

    h1 {
      font-size: clamp(48px, 12vw, 88px);
      line-height: 0.98;
      letter-spacing: 0;
      color: #ff4f96;
      text-shadow:
        4px 4px 0 #ffffff,
        0 10px 22px rgba(255, 97, 160, 0.22);
    }

    p {
      max-width: 430px;
      margin: 20px auto 0;
      font-size: clamp(18px, 5vw, 25px);
      line-height: 1.4;
      color: #705163;
    }

    .hearts {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 28px;
    }

    .heart {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: #ffffff;
      font-weight: 900;
      background: #ff7eb3;
      border-radius: 50%;
      box-shadow: 0 8px 16px rgba(255, 88, 152, 0.2);
      animation: bounce 1.8s ease-in-out infinite;
    }

    .heart:nth-child(2) {
      background: #7bdff2;
      animation-delay: 0.16s;
    }

    .heart:nth-child(3) {
      background: #f7d85c;
      animation-delay: 0.32s;
    }

    .sparkle {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 22px #ffffff;
      animation: twinkle 2.8s ease-in-out infinite;
    }

    .sparkle:nth-child(1) { top: 16%; left: 18%; }
    .sparkle:nth-child(2) { top: 24%; right: 15%; animation-delay: 0.5s; }
    .sparkle:nth-child(3) { bottom: 18%; left: 14%; animation-delay: 1s; }
    .sparkle:nth-child(4) { bottom: 24%; right: 18%; animation-delay: 1.5s; }
    .sparkle:nth-child(5) { top: 53%; left: 8%; animation-delay: 0.8s; }
    .sparkle:nth-child(6) { top: 58%; right: 8%; animation-delay: 1.3s; }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.35;
        transform: scale(0.65);
      }
      50% {
        opacity: 1;
        transform: scale(1.35);
      }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(8deg); }
    }

    @media (max-width: 520px) {
      body::before,
      body::after {
        inset: 12px;
        border-radius: 24px;
      }

      .card::before,
      .card::after {
        width: 54px;
        height: 42px;
        top: -20px;
      }

      .card::before {
        left: 28px;
      }

      .card::after {
        right: 28px;
      }
    }
  </style>
</head>
<body>
  <span class="sparkle"></span>
  <span class="sparkle"></span>
  <span class="sparkle"></span>
  <span class="sparkle"></span>
  <span class="sparkle"></span>
  <span class="sparkle"></span>

  <main class="card" aria-label="Cute greeting">
    <div class="tag">made with tiny sparkle energy</div>
    <div class="face" aria-hidden="true">:D</div>
    <h1>hello cutiesss</h1>
    <p>sending soft sunshine, sweet vibes, and the prettiest little smile your way.</p>
    <div class="hearts" aria-hidden="true">
      <span class="heart">x</span>
      <span class="heart">o</span>
      <span class="heart">x</span>
    </div>
  </main>
</body>
</html>
